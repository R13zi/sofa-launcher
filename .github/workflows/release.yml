# Ao enviar uma tag como v0.3.0, testa, compila e publica o instalador em Releases.
name: Publicar versão

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Testes da interface
        run: npm test

      - name: Testes do backend
        working-directory: src-tauri
        run: cargo test

      - name: Compilar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sofa ${{ github.ref_name }}
          releaseBody: Instale o arquivo Sofa_x.y.z_x64-setup.exe ou use Menu → Procurar atualizações do Sofa.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
